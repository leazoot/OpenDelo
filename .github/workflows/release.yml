name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: windows, goarch: amd64, ext: .exe }

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      # Must precede the binary: go:embed ships whatever is in web/embedded/dist,
      # and an empty console is not a build error.
      - name: Build console
        run: pnpm --dir web build

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        # The asset name carries no version. `/releases/latest/download/<name>`
        # only resolves for a name that is stable across releases, and that URL is
        # the one the README tells people to use. The version is in `--version`
        # and in the release title.
        run: |
          NAME="opendelo-${GOOS}-${GOARCH}${{ matrix.ext }}"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "dist/${NAME}" ./cmd/opendelo
          cd dist && sha256sum "${NAME}" > "${NAME}.sha256"

      - name: Smoke test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          BIN="dist/opendelo-linux-amd64"
          chmod +x "$BIN"
          "./$BIN" --version

      - uses: actions/upload-artifact@v4
        with:
          name: opendelo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 1

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Install

            ```sh
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/opendelo-linux-amd64
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SHA256SUMS
            sha256sum -c SHA256SUMS --ignore-missing
            chmod +x opendelo-linux-amd64
            sudo install -m 0755 opendelo-linux-amd64 /usr/local/bin/opendelo
            ```

            A statically linked single file with the console embedded. No Go, no
            Node, no runtime needed on the target machine.

            macOS binaries are not signed or notarised yet — Gatekeeper will block
            the first run. Clear it with `xattr -d com.apple.quarantine opendelo`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
