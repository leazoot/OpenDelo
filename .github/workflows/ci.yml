name: CI

# Manual only: the frontend dependency scan below currently fails and a
# permanently red pipeline reports nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Cache check tools
        uses: actions/cache@v4
        with:
          path: .bin
          # Tool versions are pinned at the top of the Makefile.
          key: ${{ runner.os }}-opendelo-tools-${{ hashFiles('Makefile') }}

      - name: Install tools
        run: make tools

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      # Before the tests: stale generated code would let them pass against it.
      - name: Verify sqlc output is current
        run: make generate-check

      - name: Check
        run: make check

      - name: Build
        run: make build

      - name: Vulnerability scan (Go)
        run: make vuln

      - name: Vulnerability scan (frontend)
        run: pnpm --dir web audit --audit-level=high

      - name: Smoke test
        run: ./bin/opendelo --version
